<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="634" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="30" y="44" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Synthetic data for training large language models</text>
<text x="30" y="68" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">For LLMs, augmentation mostly means using a model to create or rewrite training data, then filtering it.</text>
<rect x="30" y="96" width="144" height="104" rx="12" fill="#64748b" fill-opacity="0.08" stroke="#64748b" stroke-width="2"/>
<text x="102.0" y="124" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Seed data</text>
<text x="102.0" y="146" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">a few examples,</text>
<text x="102.0" y="164" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">web pages or</text>
<text x="102.0" y="182" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">problems</text>
<rect x="204" y="96" width="144" height="104" rx="12" fill="#0e7490" fill-opacity="0.08" stroke="#0e7490" stroke-width="2"/>
<text x="276.0" y="124" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Generator LLM</text>
<text x="276.0" y="146" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">rewrites, expands</text>
<text x="276.0" y="164" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">or answers the</text>
<text x="276.0" y="182" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">seed data</text>
<rect x="378" y="96" width="144" height="104" rx="12" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="2"/>
<text x="450.0" y="124" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Filter</text>
<text x="450.0" y="146" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">remove duplicates,</text>
<text x="450.0" y="164" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">score quality,</text>
<text x="450.0" y="182" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">check answers</text>
<rect x="552" y="96" width="144" height="104" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>
<text x="624.0" y="124" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Training set</text>
<text x="624.0" y="146" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">the kept examples,</text>
<text x="624.0" y="164" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">often mixed with</text>
<text x="624.0" y="182" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">real data</text>
<rect x="726" y="96" width="144" height="104" rx="12" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="2"/>
<text x="798.0" y="124" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Train model</text>
<text x="798.0" y="146" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">pretraining,</text>
<text x="798.0" y="164" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">fine-tuning or</text>
<text x="798.0" y="182" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">preference tuning</text>
<path d="M176 148.0 H200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M350 148.0 H374" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M524 148.0 H548" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M698 148.0 H722" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M798.0 202 V230 H276.0 V206" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="537.0" y="250" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">the trained model can generate the next round of data</text>
<text x="30" y="288" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Examples by training stage</text>
<rect x="30" y="304" width="414" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="332" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Pretraining data</text>
<text x="193.6" y="332" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">rephrasing web text</text>
<rect x="48" y="350" width="168" height="82" rx="8" fill="#f1f5f9"/>
<text x="60" y="374" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Raw web page:</text>
<text x="60" y="394" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">a messy forum post</text>
<text x="60" y="414" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">about ocean tides</text>
<path d="M222 391.0 H246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250" y="350" width="176" height="82" rx="8" fill="#0e7490" fill-opacity="0.08" stroke="#0e7490" stroke-opacity="0.5"/>
<text x="262" y="374" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">The same facts,</text>
<text x="262" y="394" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">rewritten as a clear</text>
<text x="262" y="414" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">question-and-answer text</text>
<rect x="456" y="304" width="414" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="474" y="332" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Instruction data</text>
<text x="619.6" y="332" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">Self-Instruct, Evol-Instruct</text>
<rect x="474" y="350" width="168" height="82" rx="8" fill="#f1f5f9"/>
<text x="486" y="374" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Seed task:</text>
<text x="486" y="394" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Write a poem</text>
<text x="486" y="414" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">about rain.</text>
<path d="M648 391.0 H672" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="676" y="350" width="176" height="82" rx="8" fill="#0e7490" fill-opacity="0.08" stroke="#0e7490" stroke-opacity="0.5"/>
<text x="688" y="374" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Harder task: Write a</text>
<text x="688" y="394" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">14-line sonnet about rain,</text>
<text x="688" y="414" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">plus the LLM's answer</text>
<rect x="30" y="464" width="414" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="492" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Reasoning data</text>
<text x="176.39999999999998" y="492" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">rejection sampling</text>
<rect x="48" y="510" width="168" height="82" rx="8" fill="#f1f5f9"/>
<text x="60" y="534" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Problem: 17 × 24 = ?</text>
<text x="60" y="554" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Sample 4 solutions</text>
<text x="60" y="574" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">with reasoning steps</text>
<path d="M222 551.0 H246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250" y="510" width="176" height="82" rx="8" fill="#0e7490" fill-opacity="0.08" stroke="#0e7490" stroke-opacity="0.5"/>
<rect x="260" y="522" width="80" height="20" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.6"/>
<text x="300" y="536" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">408 ✓ keep</text>
<rect x="344" y="522" width="80" height="20" rx="10" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.6"/>
<text x="384" y="536" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">398 ✗ drop</text>
<rect x="260" y="548" width="80" height="20" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.6"/>
<text x="300" y="562" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">408 ✓ keep</text>
<rect x="344" y="548" width="80" height="20" rx="10" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.6"/>
<text x="384" y="562" font-size="12" fill="#334155" font-weight="normal" text-anchor="middle">418 ✗ drop</text>
<text x="262" y="584" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">train only on correct ones</text>
<rect x="456" y="464" width="414" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="474" y="492" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Alignment data</text>
<text x="602.4" y="492" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">AI feedback (RLAIF)</text>
<rect x="474" y="510" width="168" height="82" rx="8" fill="#f1f5f9"/>
<text x="486" y="534" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">One prompt,</text>
<text x="486" y="554" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">two answers:</text>
<text x="486" y="574" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">A and B</text>
<path d="M648 551.0 H672" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="676" y="510" width="176" height="82" rx="8" fill="#0e7490" fill-opacity="0.08" stroke="#0e7490" stroke-opacity="0.5"/>
<text x="688" y="534" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">A judge LLM prefers A,</text>
<text x="688" y="554" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">giving a preference pair:</text>
<text x="688" y="574" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">A is better than B</text>
</svg>
